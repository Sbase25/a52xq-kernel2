- name: Build kernel
        run: |
          export ARCH=arm64
          export KBUILD_BUILD_USER="Gemini"
          export KBUILD_BUILD_HOST="GitHub-Actions"
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH"
          
          # Define compiler arguments
          MAKE_ARGS="ARCH=arm64 \
            O=out \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1"

          # 1. Prepare Output Directory
          mkdir -p out

          # 2. Determine Base Config
          # Lito is the codename for SM7225/750G
          if [ -f "arch/arm64/configs/vendor/lito-perf_defconfig" ]; then
              BASE_CONF="vendor/lito-perf_defconfig"
          elif [ -f "arch/arm64/configs/vendor/lito_defconfig" ]; then
              BASE_CONF="vendor/lito_defconfig"
          else
              # Fallback to search if the above paths are slightly different
              BASE_CONF=$(find arch/arm64/configs/vendor/ -name "lito*_defconfig" | head -n 1 | sed 's|arch/arm64/configs/||')
          fi

          echo "Base Config: $BASE_CONF"
          
          # 3. Create the base .config
          make $MAKE_ARGS $BASE_CONF

          # 4. Merge the Samsung Fragment
          # Instead of merge_config.sh (which is picky about paths), we append and resync
          echo "Merging Samsung fragment: arch/arm64/configs/vendor/samsung/a52xq.config"
          cat arch/arm64/configs/vendor/samsung/a52xq.config >> out/.config
          
          # 5. Resync the config (This is the 'magic' step to fix the '.config does not exist' error)
          # 'olddefconfig' takes the current .config and provides default values for any new symbols
          make $MAKE_ARGS olddefconfig

          # 6. Final Compilation
          make -j$(nproc --all) $MAKE_ARGS
