- name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev libelf-dev \
            python3 python-is-python3 gcc-aarch64-linux-gnu \
            build-essential libncurses-dev xz-utils curl git lz4 liblz4-tool

      - name: Build kernel
        run: |
          export ARCH=arm64
          export KBUILD_BUILD_USER="Gemini"
          export KBUILD_BUILD_HOST="GitHub-Actions"
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH"
          
          # Added KCFLAGS to prevent compiler memory exhaustion on large drivers
          MAKE_ARGS="ARCH=arm64 \
            O=out \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS=-fno-var-tracking-assignments"

          mkdir -p out

          # 1. Identify Base Config
          if [ -f "arch/arm64/configs/vendor/lito-perf_defconfig" ]; then
              BASE_CONF="vendor/lito-perf_defconfig"
          else
              BASE_CONF="vendor/lito_defconfig"
          fi

          # 2. Generate initial .config
          make $MAKE_ARGS $BASE_CONF

          # 3. Merge Samsung Fragment and Validate
          if [ -f "arch/arm64/configs/vendor/samsung/a52xq.config" ]; then
              cat arch/arm64/configs/vendor/samsung/a52xq.config >> out/.config
              make $MAKE_ARGS olddefconfig
          fi

          # 4. Compile with optimized thread count
          # We use -k (keep going) so we can see ALL errors if it fails
          make -j$(nproc --all) $MAKE_ARGS || make $MAKE_ARGS
