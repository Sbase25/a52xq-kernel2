- name: Build kernel
        run: |
          export ARCH=arm64
          export KBUILD_BUILD_USER="Gemini"
          export KBUILD_BUILD_HOST="GitHub-Actions"
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH"
          
          MAKE_ARGS="ARCH=arm64 \
            O=out \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1"

          # 1. Create the output directory
          mkdir -p out

          # 2. Merge the base Qualcomm config with the Samsung fragment
          # Most SM7225 (Lito) kernels use lito_defconfig as the base
          echo "Merging configs..."
          
          # Check which base exists
          if [ -f "arch/arm64/configs/vendor/lito-perf_defconfig" ]; then
              BASE_CONF="vendor/lito-perf_defconfig"
          else
              BASE_CONF="vendor/lito_defconfig"
          fi
          
          # The fragment we found earlier
          SAMSUNG_FRAGMENT="vendor/samsung/a52xq.config"

          echo "Base: $BASE_CONF | Fragment: $SAMSUNG_FRAGMENT"

          # Apply base first
          make $MAKE_ARGS $BASE_CONF
          
          # Apply the Samsung fragment on top of the generated .config
          # We use the 'scripts/kconfig/merge_config.sh' tool built into the kernel
          ARCH=arm64 ./scripts/kconfig/merge_config.sh -O out out/.config arch/arm64/configs/$SAMSUNG_FRAGMENT

          # 3. Final Build
          make -j$(nproc --all) $MAKE_ARGS
