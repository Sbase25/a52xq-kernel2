name: Build Kernel

on:
  push:
    branches: [ lineage-23.2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: samsung-sm7225/android_kernel_samsung_sm7225
          ref: lineage-23.2
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev libelf-dev \
            python3 python-is-python3 gcc-aarch64-linux-gnu \
            build-essential libncurses-dev xz-utils libssl-dev \
            ccache

      - name: Download Clang Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchains/clang
          # Using a stable, prebuilt Clang 17 mirror (compatible with Lineage 23/Android 14+ bases)
          curl -LSs "https://github.com/ZyCromerZ/Clang/releases/download/17.0.0-20230522/Clang-17.0.0-20230522.tar.gz" -o clang.tar.gz
          tar -xf clang.tar.gz -C $GITHUB_WORKSPACE/toolchains/clang
          rm clang.tar.gz

      - name: Build kernel
        run: |
          # Setup Path and Environment
          export ARCH=arm64
          export KBUILD_BUILD_USER="Gemini"
          export KBUILD_BUILD_HOST="GitHub-Actions"
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH"
          
          # Compiler flags
          MAKE_ARGS="ARCH=arm64 \
            O=out \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1"

          # Configuration
          make $MAKE_ARGS vendor/a52xq_eur_open_defconfig

          # Build
          make -j$(nproc --all) $MAKE_ARGS

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-a52xq
          path: |
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img
