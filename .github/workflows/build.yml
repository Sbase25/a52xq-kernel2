- name: Build kernel
        run: |
          export ARCH=arm64
          export KBUILD_BUILD_USER="Gemini"
          export KBUILD_BUILD_HOST="GitHub-Actions"
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH"
          
          # Removed the incompatible -fno-var-tracking-assignments flag
          MAKE_ARGS="ARCH=arm64 \
            O=out \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1"

          mkdir -p out

          # Determine Base Config
          if [ -f "arch/arm64/configs/vendor/lito-perf_defconfig" ]; then
              BASE_CONF="vendor/lito-perf_defconfig"
          else
              BASE_CONF="vendor/lito_defconfig"
          fi

          echo "Using Base Config: $BASE_CONF"

          # 1. Generate config
          make $MAKE_ARGS $BASE_CONF

          # 2. Merge Samsung Fragment
          if [ -f "arch/arm64/configs/vendor/samsung/a52xq.config" ]; then
              echo "Merging Samsung fragment..."
              cat arch/arm64/configs/vendor/samsung/a52xq.config >> out/.config
              make $MAKE_ARGS olddefconfig
          fi

          # 3. Compile
          make -j$(nproc --all) $MAKE_ARGS
